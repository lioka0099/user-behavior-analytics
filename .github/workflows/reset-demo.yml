name: Reset demo account

on:
  schedule:
    - cron: "0 3 * * *" # every night, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m scripts.seed_demo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # The app's config refuses to import without it; the seed script never signs tokens.
          JWT_SECRET: not-used-by-the-seed-script

  # GitHub pauses scheduled workflows in a public repo after 60 days without repo
  # activity. Re-enabling this workflow on every run restarts that clock.
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/reset-demo.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
